name: Deploy EasySAM Application

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set Environment Name
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "STAGE=prod" >> $GITHUB_OUTPUT
            echo "ROLE_ARN=${{ secrets.AWS_PROD_ROLE_ARN }}" >> $GITHUB_OUTPUT
          else
            echo "STAGE=dev" >> $GITHUB_OUTPUT
            echo "ROLE_ARN=${{ secrets.AWS_DEV_ROLE_ARN }}" >> $GITHUB_OUTPUT
          fi

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Setup Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.env.outputs.ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run Tests
        run: uv run pytest

      # PR Validation Gate: Verify schema and cloud resources on Pull Requests (before merge)
      - name: PR Validation (Schema & Cloud Check)
        if: github.event_name == 'pull_request'
        run: |
          uv run easysam --environment ${{ steps.env.outputs.STAGE }} inspect schema .
          uv run easysam --environment ${{ steps.env.outputs.STAGE }} inspect cloud .

      # Deployment: easysam deploy automatically performs schema validation, template generation, dependency sync, and SAM deploy internally.
      - name: Deploy to AWS
        if: github.event_name == 'push'
        run: uv run easysam --environment ${{ steps.env.outputs.STAGE }} deploy .
